name: CI Build + Tests (Windows / Linux / Debian)

# Full cross-platform build plus unit tests, triggered by any pull request
# targeting the ci-build branch. Mirrors bitbucket-pipelines.yml, with one
# addition Bitbucket Cloud can't offer: native windows-latest runners, so the
# unit tests also run under MSVC and MSYS2 MinGW on real Windows.
#
# - The installer .exe is cross-compiled with mingw-w64 in a debian:trixie
#   container (GCC 14 - Ubuntu's mingw-w64 is GCC 13, which lacks C++23
#   <print>), and the Inno Setup installer is built with ISCC under Wine.
# - Unit tests run on: Linux GCC (+ gcov coverage gate), Windows MSVC,
#   Windows MinGW, and mingw-w64-cross under Wine. Any failure fails the
#   job; JUnit XML results and the coverage report are uploaded as
#   artifacts (Actions tab) and expire automatically.

on:
  pull_request:
    branches: [ci-build]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
      app_version_short: ${{ steps.ver.outputs.app_version_short }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          source tools/ci-version.sh
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version_short=$APP_VERSION_SHORT" >> "$GITHUB_OUTPUT"

  windows-cross:
    needs: version
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      APP_VERSION_SHORT: ${{ needs.version.outputs.app_version_short }}
    steps:
      - name: Install mingw-w64
        run: |
          apt-get update
          apt-get install -y mingw-w64 cmake ninja-build git

      - uses: actions/checkout@v4

      - name: Configure (mingw-w64 cross toolchain)
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=mingw-w64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build CoreStationHXAgent.exe
        run: cmake --build build-win --target CoreStationHXAgent

      - name: Build Inno Setup installer (ISCC under Wine)
        run: bash tools/build-inno-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CoreStationHXAgent-windows-${{ env.APP_VERSION }}
          path: |
            build-win/bin/CoreStationHXAgent.exe
            Output/CoreStation_HX_Agent_Installer_${{ env.APP_VERSION }}.exe
          if-no-files-found: error

  linux-and-debian:
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libdbus-1-dev dpkg-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build CoreStationHXAgent
        run: cmake --build build --target CoreStationHXAgent -- -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: CoreStationHXAgent-linux-${{ env.APP_VERSION }}
          path: build/bin/CoreStationHXAgent
          if-no-files-found: error

      - name: Package .deb (cpack)
        working-directory: build
        run: cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: CoreStationHXAgent-debian-${{ env.APP_VERSION }}
          path: build/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Unit tests. All use the dev-ci profile (every module + tests, real IPC
  # auth - cmake/profiles/dev-ci.cmake).
  # ---------------------------------------------------------------------------

  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libdbus-1-dev libssl-dev gcovr

      - name: Configure (with gcov coverage)
        run: cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Debug -DDEVELOPMENT_PROFILE=dev-ci -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-tests -- -j"$(nproc)"

      - name: List tests
        run: ctest --test-dir build-tests -N | tail -1

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure --timeout 30 --output-junit "$GITHUB_WORKSPACE/test-results/linux.xml"

      - name: Coverage report + gate (COVERAGE_MIN_LINE, cmake/coverage.cmake)
        run: cmake --build build-tests --target coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: |
            test-results/
            build-tests/coverage/

  tests-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # build.bat sets up MSVC via vswhere/vcvarsall, builds into
      # build-dev-ci\ and runs the tests (dev profiles never touch installer\).
      - name: Build + test (build.bat --profile dev-ci)
        shell: cmd
        run: .\build.bat --profile dev-ci

      - name: JUnit results
        if: always()
        shell: cmd
        run: ctest --test-dir build-dev-ci --output-junit "%GITHUB_WORKSPACE%\test-results\windows-msvc.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-msvc
          path: test-results/

  tests-windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build-mingw-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEVELOPMENT_PROFILE=dev-ci

      - name: Build
        run: cmake --build build-mingw-tests

      - name: List tests
        run: ctest --test-dir build-mingw-tests -N | tail -1

      - name: Run tests
        run: ctest --test-dir build-mingw-tests --output-on-failure --timeout 30 --output-junit "$(cygpath -m "$GITHUB_WORKSPACE")/test-results/windows-mingw.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-mingw
          path: test-results/

  tests-windows-cross-wine:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install mingw-w64 + Wine
        run: |
          apt-get update
          apt-get install -y mingw-w64 cmake ninja-build git wine

      - uses: actions/checkout@v4

      - name: Configure (mingw-w64 cross; Wine is the test emulator)
        run: |
          cmake -S . -B build-win-tests -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=mingw-w64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DDEVELOPMENT_PROFILE=dev-ci

      - name: Build
        env:
          WINEDEBUG: -all
        run: cmake --build build-win-tests

      - name: Run tests under Wine
        env:
          WINEDEBUG: -all
        run: |
          ctest --test-dir build-win-tests -N | tail -1
          ctest --test-dir build-win-tests --output-on-failure --timeout 120 --parallel "$(nproc)" \
            --output-junit "$GITHUB_WORKSPACE/test-results/windows-mingw-wine.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-cross-wine
          path: test-results/
